<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="jupRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CB4B16"/>
      <stop offset="50%" stop-color="#B58900"/>
      <stop offset="100%" stop-color="#2AA198"/>
    </linearGradient>
    <linearGradient id="jupCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D33682"/>
      <stop offset="100%" stop-color="#6C71C4"/>
    </linearGradient>
  </defs>
  <!-- Background Card (Solarized Light Base3) -->
  <rect width="40" height="40" rx="8" fill="#FDF6E3"/>
  <!-- Upper Orbital Ring Arc -->
  <path d="M 6 18 C 8 10, 32 10, 34 18" fill="none" stroke="url(#jupRingGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Central Kernel Core -->
  <circle cx="20" cy="20" r="7.5" fill="url(#jupCoreGrad)"/>
  <!-- Core Highlight -->
  <circle cx="18" cy="18" r="2.5" fill="#FFFFFF" opacity="0.4"/>
  <!-- Lower Orbital Ring Arc (Foreground) -->
  <path d="M 34 22 C 32 30, 8 30, 6 22" fill="none" stroke="url(#jupRingGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Orbital Satellite Nodes -->
  <circle cx="10" cy="14" r="1.8" fill="#CB4B16"/>
  <circle cx="30" cy="26" r="1.8" fill="#2AA198"/>
  <circle cx="20" cy="31" r="1.4" fill="#B58900"/>
</svg>
