name: Release Jörmungandr

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Jörmungandr
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Ant Javac2 Compatibility
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:JAVA_HOME\Packages" -Force -ErrorAction SilentlyContinue | Out-Null

      - name: Build Plugins and Sandbox
        shell: pwsh
        run: |
          .\gradlew.bat buildPlugin prepareSandbox --no-daemon

      - name: Package Release Assets
        id: package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          Write-Host "Packaging release for tag: $tag"
          
          $distDir = New-Item -ItemType Directory -Path "release-dist" -Force
          
          # 1. Modular Plugin Package
          $pluginZip = Get-ChildItem -Path "modules/platform-shell/build/distributions/*.zip" | Select-Object -First 1
          if ($pluginZip) {
              $destPlugin = Join-Path $distDir.FullName "Jormungandr-Plugin-$tag.zip"
              Copy-Item -Path $pluginZip.FullName -Destination $destPlugin -Force
              Write-Host "Packaged plugin: $destPlugin ($([math]::Round((Get-Item $destPlugin).Length / 1MB, 2)) MB)"
          } else {
              Write-Error "Plugin zip distribution not found!"
          }

          # 2. Standalone Portable Distribution
          $ideaHome = Get-ChildItem -Path "$env:USERPROFILE\.gradle\caches\*\transforms\*\transformed\ideaIC-*-win" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          $sandboxPlugins = Get-ChildItem -Path "modules\platform-shell\build\idea-sandbox\IC-*\plugins" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($ideaHome -and $sandboxPlugins) {
              Write-Host "Found IntelliJ Base: $($ideaHome.FullName)"
              Write-Host "Found Sandbox Plugins: $($sandboxPlugins.FullName)"

              $stagingDir = New-Item -ItemType Directory -Path "staging\Jormungandr-$tag" -Force
              $resourcesDir = (Resolve-Path "modules\platform-shell\src\main\resources").Path
              
              # Copy IntelliJ base platform
              Copy-Item -Path "$($ideaHome.FullName)\*" -Destination $stagingDir.FullName -Recurse -Force
              
              # Copy Jörmungandr plugins into isolated jormungandr-plugins directory
              $targetPluginsDir = Join-Path $stagingDir.FullName "jormungandr-plugins"
              New-Item -ItemType Directory -Path $targetPluginsDir -Force | Out-Null
              Copy-Item -Path "$($sandboxPlugins.FullName)\*" -Destination $targetPluginsDir -Recurse -Force

              # Build and package jormungandr-bootstrap.jar containing icons, splash, and themes for root classpath
              $bootstrapJar = Join-Path $stagingDir.FullName "lib\jormungandr-bootstrap.jar"
              Push-Location $resourcesDir
              try {
                  & 7z a -tzip $bootstrapJar "icons" "splash" "themes" "consents*.json" | Out-Null
              } finally {
                  Pop-Location
              }

              # Update launcher icons in bin
              Copy-Item "$resourcesDir\icons\jormungandr.svg" -Destination "$($stagingDir.FullName)\bin\idea.svg" -Force
              Copy-Item "$resourcesDir\icons\jormungandr.svg" -Destination "$($stagingDir.FullName)\bin\jormungandr.svg" -Force
              Copy-Item "$resourcesDir\icons\jormungandr.ico" -Destination "$($stagingDir.FullName)\bin\idea.ico" -Force
              Copy-Item "$resourcesDir\icons\jormungandr.ico" -Destination "$($stagingDir.FullName)\bin\jormungandr.ico" -Force

              # Configure portable data directories
              New-Item -ItemType Directory -Path "$($stagingDir.FullName)\portable-data\config\options" -Force | Out-Null
              New-Item -ItemType Directory -Path "$($stagingDir.FullName)\portable-data\system" -Force | Out-Null
              New-Item -ItemType Directory -Path "$($stagingDir.FullName)\portable-data\log" -Force | Out-Null

              # Update product-info.json for native launcher branding
              $productInfoPath = Join-Path $stagingDir.FullName "product-info.json"
              $productInfoJson = Get-Content $productInfoPath -Raw | ConvertFrom-Json
              $productInfoJson.name = "Jörmungandr"
              $productInfoJson.productVendor = "indoctrinatedrecluse"
              $productInfoJson.dataDirectoryName = "Jormungandr1.0"
              $productInfoJson.svgIconPath = "bin/jormungandr.svg"
              if ($productInfoJson.launch[0].bootClassPathJarNames -notcontains "jormungandr-bootstrap.jar") {
                  $productInfoJson.launch[0].bootClassPathJarNames += "jormungandr-bootstrap.jar"
              }
              $newArgs = @()
              foreach ($arg in $productInfoJson.launch[0].additionalJvmArguments) {
                  if ($arg -like "-Didea.vendor.name=*") {
                      $newArgs += "-Didea.vendor.name=indoctrinatedrecluse"
                  } elseif ($arg -like "-Didea.paths.selector=*") {
                      $newArgs += "-Didea.paths.selector=Jormungandr1.0"
                  } else {
                      $newArgs += $arg
                  }
              }
              $newArgs += "-Didea.product.name=Jörmungandr"
              $newArgs += "-Didea.application.name=Jörmungandr"
              $productInfoJson.launch[0].additionalJvmArguments = $newArgs
              $productInfoJson | ConvertTo-Json -Depth 10 | Set-Content $productInfoPath -Encoding UTF8

              # Write portable bin/idea.properties
              $propsLines = @(
                  "# Jörmungandr Standalone Portable IDE Configuration",
                  "idea.config.path=`${idea.home.path}/portable-data/config",
                  "idea.system.path=`${idea.home.path}/portable-data/system",
                  "idea.plugins.path=`${idea.home.path}/jormungandr-plugins",
                  "idea.log.path=`${idea.home.path}/portable-data/log",
                  "idea.vendor.name=indoctrinatedrecluse",
                  "idea.product.name=Jörmungandr",
                  "idea.application.name=Jörmungandr"
              )
              $propsLines | Set-Content -Path "$($stagingDir.FullName)\bin\idea.properties" -Encoding UTF8

              # Append JVM properties to bin/idea64.exe.vmoptions
              $vmOptions = @(
                  "",
                  "-Didea.vendor.name=indoctrinatedrecluse",
                  "-Didea.product.name=Jörmungandr",
                  "-Didea.application.name=Jörmungandr",
                  "-Didea.platform.prefix=Idea",
                  "-Didea.paths.selector=Jormungandr1.0",
                  "-Didea.required.plugins.id=org.jormungandr.ide",
                  "-Djb.consents.confirmation.enabled=false",
                  "-Deua.consents.confirmation.enabled=false",
                  "-Didea.initially.ask.config=false",
                  "-Dide.show.tips.on.startup=false",
                  "-Dide.mac.message.dialogs.as.sheets=false",
                  "-Dwsl.use.remote.agent.for.nio.filesystem=false",
                  "-Dwsl.enabled=false",
                  "-Dide.ijent.wsldefault=false",
                  "-Didea.wsl.support.enabled=false",
                  "-Dsplash=true"
              )
              $vmOptions | Add-Content -Path "$($stagingDir.FullName)\bin\idea64.exe.vmoptions" -Encoding UTF8
              Copy-Item "$($stagingDir.FullName)\bin\idea64.exe" -Destination "$($stagingDir.FullName)\bin\jormungandr64.exe" -Force
              Copy-Item "$($stagingDir.FullName)\bin\idea64.exe.vmoptions" -Destination "$($stagingDir.FullName)\bin\jormungandr64.exe.vmoptions" -Force

              # Update bin/idea.bat to include jormungandr-bootstrap.jar on CLASS_PATH
              $ideaBatPath = "$($stagingDir.FullName)\bin\idea.bat"
              if (Test-Path $ideaBatPath) {
                  $batLines = Get-Content $ideaBatPath
                  $newBatLines = @()
                  foreach ($line in $batLines) {
                      $newBatLines += $line
                      if ($line -like '*SET "CLASS_PATH=%CLASS_PATH%;%IDE_HOME%\lib\trove.jar"*') {
                          $newBatLines += 'SET "CLASS_PATH=%CLASS_PATH%;%IDE_HOME%\lib\jormungandr-bootstrap.jar"'
                      }
                  }
                  $newBatLines | Set-Content $ideaBatPath -Encoding ascii
              }

              # Pre-populate consent in portable-data/config
              $nowMs = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
              $acceptedStr = "rsch.send.usage.stat:1.1:0:$nowMs;eap:2021.2:0:$nowMs;`n"
              $cachedJson = '[{"consentId":"rsch.send.usage.stat","version":"1.1","text":"Help improve Jörmungandr.","printableName":"Send Usage Statistics","accepted":"false"},{"consentId":"eap","version":"2021.2","text":"Surveys","printableName":"Feedback","accepted":"false"}]'
              @(
                  "$($stagingDir.FullName)\portable-data\config\consentOptions",
                  "$($stagingDir.FullName)\portable-data\config\jormungandr\consentOptions",
                  "$($stagingDir.FullName)\portable-data\config\idea\consentOptions"
              ) | ForEach-Object {
                  if (-not (Test-Path $_)) { New-Item -ItemType Directory -Path $_ -Force | Out-Null }
                  Set-Content -Path (Join-Path $_ "accepted") -Value $acceptedStr -Encoding UTF8
                  Set-Content -Path (Join-Path $_ "cached") -Value $cachedJson -Encoding UTF8
              }

              $otherXml = @(
                  "<application>",
                  "  <component name=`"PropertyService`"><![CDATA[{",
                  "  `"keyToString`": {",
                  "    `"eua_accepted_version`": `"2.0`",",
                  "    `"privacy_policy_accepted_version`": `"2.0`",",
                  "    `"previous_eua_accepted_version`": `"2.0`",",
                  "    `"ask.about.tip.of.the.day`": `"false`",",
                  "    `"show.tips.on.startup`": `"false`"",
                  "  }",
                  "}]]></component>",
                  "</application>"
              ) -join "`r`n"
              Set-Content -Path "$($stagingDir.FullName)\portable-data\config\options\other.xml" -Value $otherXml -Encoding UTF8

              # Add root launcher script
              $launcherBat = Join-Path $stagingDir.FullName "Jormungandr.bat"
              "@echo off`r`nstart """" ""%~dp0bin\idea64.exe"" %*" | Out-File -FilePath $launcherBat -Encoding ascii

              # Compress using 7-Zip
              $portableZip = Join-Path $distDir.FullName "Jormungandr-$tag-windows-x64.zip"
              Write-Host "Compressing standalone portable package to $portableZip..."
              & 7z a -tzip -mx=5 $portableZip "$($stagingDir.FullName)"
              Write-Host "Created portable archive: $([math]::Round((Get-Item $portableZip).Length / 1MB, 2)) MB"
          } else {
              Write-Warning "Could not find ideaIC base or sandbox plugins; skipping standalone package bundle."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Jörmungandr ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
